services:
  postgres:
    image: postgres:16-alpine
    container_name: shopma-pg
    environment:
      POSTGRES_DB: shopma
      POSTGRES_USER: shopma
      POSTGRES_PASSWORD: shopma
    ports:
      - "5432:5432"
    volumes:
      - shopma_pgdata:/var/lib/postgresql/data

volumes:
  shopma_pgdata:
