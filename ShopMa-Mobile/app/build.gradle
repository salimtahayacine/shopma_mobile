plugins {
    id 'com.android.application'
}

// Lecture de la clé API Google Maps depuis local.properties
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
def mapsApiKey = localProps.getProperty('MAPS_API_KEY', 'VOTRE_CLE_API_GOOGLE_MAPS_ICI')

android {
    namespace 'ma.shopma.app'
    compileSdk 34

    defaultConfig {
        applicationId "ma.shopma.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Injecte la clé Maps dans le manifest (placeholder ${MAPS_API_KEY})
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Retrofit + Gson pour l'API REST FakeStoreAPI
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // Google Maps
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Glide pour le chargement des images produits
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}
